<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Fruit Ninja</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #1a0f08;
    font-family: "Trebuchet MS", "Segoe UI", Verdana, sans-serif;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    cursor: crosshair;
  }
  #game { position: fixed; inset: 0; }
  #game canvas { display: block; }
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 5; }

  /* ---------- HUD ---------- */
  #hud {
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
    opacity: 0; transition: opacity .4s;
  }
  #hud.visible { opacity: 1; }
  .hud-score {
    position: absolute; top: 14px; left: 18px;
    display: flex; align-items: center; gap: 10px;
  }
  .hud-score .icon { font-size: 34px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.6)); }
  .hud-score .value {
    font-size: 42px; font-weight: 800; color: #ffd94a;
    text-shadow: 0 2px 0 #7a4a12, 0 4px 8px rgba(0,0,0,.55);
    font-variant-numeric: tabular-nums;
  }
  .hud-best {
    position: absolute; top: 64px; left: 20px;
    font-size: 15px; font-weight: 700; color: #ffe9b0;
    text-shadow: 0 2px 4px rgba(0,0,0,.7); letter-spacing: .04em;
  }
  .hud-lives {
    position: absolute; top: 16px; right: 18px;
    display: flex; gap: 8px;
  }
  .hud-lives img {
    width: 36px; height: 36px; object-fit: contain;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.5));
    transition: transform .25s, opacity .25s;
  }
  .hud-lives img.lost { transform: scale(1.18) rotate(-8deg); opacity: .85; }
  #pauseBtn {
    position: absolute; left: 14px; bottom: 14px;
    width: 62px; height: 62px; border: 0; padding: 0; background: none;
    cursor: pointer; pointer-events: auto;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,.55));
    transition: transform .1s;
  }
  #pauseBtn:active { transform: scale(.92); }
  #pauseBtn img { width: 100%; height: 100%; }
  #powerChips {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px;
  }
  .chip {
    padding: 7px 20px; transform: skewX(-8deg);
    font-size: 19px; font-weight: 900; font-style: italic; letter-spacing: .06em;
    color: #fff; text-shadow: 0 2px 2px rgba(0,0,0,.5);
    border: 2px solid rgba(255,255,255,.55); border-radius: 6px;
    box-shadow: 0 3px 10px rgba(0,0,0,.45), inset 0 2px 3px rgba(255,255,255,.4);
    animation: chippulse 1s ease-in-out infinite;
  }
  .chip.freeze { background: linear-gradient(180deg, #6db4ec 0%, #2e7cc4 60%, #1d5a90 100%); }
  .chip.frenzy { background: linear-gradient(180deg, #ffb52e 0%, #f07818 60%, #c8500c 100%); }
  .chip.double { background: linear-gradient(180deg, #ffe066 0%, #f0a824 60%, #c07808 100%); color: #6a3404; text-shadow: 0 1px 1px rgba(255,255,255,.5); }
  @keyframes chippulse { 50% { transform: skewX(-8deg) scale(1.06); } }
  #timer {
    position: absolute; top: 10px; right: 16px;
    display: none; align-items: center; gap: 6px;
  }
  #timer.on { display: flex; }
  #timer img { width: 40px; height: 46px; object-fit: contain; filter: drop-shadow(0 2px 3px rgba(0,0,0,.5)); }
  #timer .digits {
    font-size: 44px; font-weight: 900; font-variant-numeric: tabular-nums;
    color: #ffd94a;
    text-shadow: 0 2px 0 #7a4a12, 0 4px 8px rgba(0,0,0,.55);
  }
  #timer.low .digits { color: #ff5238; text-shadow: 0 2px 0 #6a1204, 0 4px 8px rgba(0,0,0,.6); }

  /* ---------- Overlays ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; text-align: center;
    background: radial-gradient(ellipse at center, rgba(20,10,4,.25) 0%, rgba(12,6,2,.72) 100%);
    transition: opacity .45s; opacity: 1;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; visibility: hidden; transition: opacity .45s, visibility 0s .45s; }
  .overlay.hidden .btn { pointer-events: none; }
  .logo {
    font-size: clamp(40px, 7.5vw, 78px); font-weight: 900; line-height: .95;
    letter-spacing: .01em;
    transform: rotate(-3deg);
    text-shadow: 0 3px 0 rgba(60,20,0,.55), 0 8px 18px rgba(0,0,0,.6);
  }
  .logo .l1 { color: #b04ce0; } .logo .l2 { color: #f04434; }
  .logo .l3 { color: #6ac03a; } .logo .l4 { color: #f79a1e; }
  .logo .l5 { color: #f7d02e; }
  .logo .ninja {
    color: #fdfdfd; display: block; font-size: 1.14em;
    text-shadow: 0 3px 0 #45505c, 0 6px 0 #2b333c, 0 12px 24px rgba(0,0,0,.7);
  }

  .mode-row { display: flex; gap: clamp(14px, 4vw, 48px); align-items: center; justify-content: center; flex-wrap: wrap; }

  /* Mode rings (rotating mode text around a 3D fruit), FN2-style colors */
  .mode-ring {
    position: relative; width: min(38vw, 230px); height: min(38vw, 230px);
    pointer-events: auto; cursor: pointer;
    transition: transform .15s;
  }
  .mode-ring:hover { transform: scale(1.04); }
  .mode-ring:active { transform: scale(.97); }
  .mode-ring .stone {
    position: absolute; inset: 0; border-radius: 50%;
    filter: drop-shadow(0 6px 14px rgba(0,0,0,.55));
  }
  .mode-ring.blue .stone {
    background: radial-gradient(closest-side,
      rgba(0,0,0,0) 55%, #123a66 56.5%, #2e7cc4 60%, #6db4ec 64%,
      #3d8ed4 70%, #1d5a90 76%, #123a66 78.5%, rgba(0,0,0,0) 80%);
  }
  .mode-ring.gold .stone {
    background: radial-gradient(closest-side,
      rgba(0,0,0,0) 55%, #7a4a0c 56.5%, #d89c24 60%, #f7dc82 64%,
      #e8b73e 70%, #9c6a14 76%, #7a4a0c 78.5%, rgba(0,0,0,0) 80%);
  }
  .mode-ring svg { position: absolute; inset: 0; animation: ringspin 16s linear infinite; }
  .mode-ring text {
    font: 900 23px "Trebuchet MS", Verdana, sans-serif;
    letter-spacing: 3px;
  }
  .mode-ring.blue text { fill: #f2f8ff; }
  .mode-ring.gold text { fill: #c42e1a; }
  .mode-label {
    position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%);
    font-size: 14px; font-weight: 900; letter-spacing: .08em; color: #ffe9b0;
    text-shadow: 0 2px 4px rgba(0,0,0,.8);
  }
  @keyframes ringspin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .mode-ring svg { animation: none; } }
  .tagline { font-size: 18px; color: #ffe9b0; font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,.8); }
  .btn {
    pointer-events: auto; cursor: pointer; border: none; outline: none;
    font: inherit; font-size: 26px; font-weight: 900; letter-spacing: .05em;
    color: #4a1c00; padding: 16px 44px; border-radius: 999px;
    background: linear-gradient(180deg, #ffe066 0%, #ffb52e 55%, #f28c12 100%);
    box-shadow: 0 5px 0 #9c5406, 0 10px 22px rgba(0,0,0,.55), inset 0 2px 2px rgba(255,255,255,.65);
    transform: translateZ(0); transition: transform .1s, box-shadow .1s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #9c5406, 0 6px 14px rgba(0,0,0,.5), inset 0 2px 2px rgba(255,255,255,.65); }
  .gameover-title {
    font-size: clamp(46px, 9vw, 92px); font-weight: 900; color: #ff3d2e;
    text-shadow: 0 3px 0 #7a0e04, 0 6px 0 #4a0802, 0 12px 24px rgba(0,0,0,.8);
    transform: rotate(-2deg);
  }
  .final-score { font-size: 30px; font-weight: 800; color: #ffd94a; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
  .new-best { font-size: 20px; font-weight: 900; color: #7dff6a; text-shadow: 0 2px 6px rgba(0,0,0,.8);
    animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.12); } }
  .new-best.hidden { display: none; }
  .credit {
    position: absolute; bottom: 10px; left: 0; right: 0;
    font-size: 11px; color: rgba(255,233,176,.55); pointer-events: auto;
  }
  .credit a { color: rgba(255,217,74,.75); }
  #loading { font-size: 20px; color: #ffe9b0; font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,.8); }
</style>
</head>
<body>
  <div id="game"></div>
  <canvas id="fx"></canvas>

  <div id="hud">
    <div class="hud-score">
      <span class="icon">🍉</span><span class="value" id="score">0</span>
    </div>
    <div class="hud-best" id="hudBest">BEST 0</div>
    <div class="hud-lives" id="lives"></div>
    <div id="timer"><img alt="" /><span class="digits">0:60</span></div>
    <button id="pauseBtn" aria-label="Pause"></button>
    <div id="powerChips"></div>
  </div>

  <div class="overlay" id="startOverlay">
    <div class="logo"><span class="l1">F</span><span class="l2">R</span><span class="l3">U</span><span class="l4">I</span><span class="l5">T</span><span class="ninja">NINJA</span></div>
    <div class="mode-row">
      <div class="mode-ring blue" id="classicRing" role="button" aria-label="Start Classic game" tabindex="0">
        <div class="stone"></div>
        <svg viewBox="0 0 250 250">
          <defs><path id="ringPathC" d="M125,125 m-101,0 a101,101 0 1,1 202,0 a101,101 0 1,1 -202,0" fill="none" /></defs>
          <text><textPath href="#ringPathC">CLASSIC &#160;&#8226;&#160; CLASSIC &#160;&#8226;&#160; CLASSIC &#160;&#8226;&#160;</textPath></text>
        </svg>
        <div class="mode-label">3 LIVES</div>
      </div>
      <div class="mode-ring gold" id="arcadeRing" role="button" aria-label="Start Arcade game" tabindex="0">
        <div class="stone"></div>
        <svg viewBox="0 0 250 250">
          <defs><path id="ringPathA" d="M125,125 m-101,0 a101,101 0 1,1 202,0 a101,101 0 1,1 -202,0" fill="none" /></defs>
          <text><textPath href="#ringPathA">ARCADE &#160;&#9733;&#160; ARCADE &#160;&#9733;&#160; ARCADE &#160;&#9733;&#160;</textPath></text>
        </svg>
        <div class="mode-label">60 SECONDS</div>
      </div>
    </div>
    <div class="tagline" id="loading">Sharpening blade…</div>
    <div class="credit">
      Fruit models: <a href="https://sketchfab.com/3d-models/free-pack-fruits-ae101b55893843d7aacc6f2809fec387" target="_blank" rel="noreferrer">"Free Pack - Fruits"</a>
      by <a href="https://sketchfab.com/polyone" target="_blank" rel="noreferrer">PolyOne Studio</a>, CC-BY-4.0
    </div>
  </div>

  <div class="overlay hidden" id="pauseOverlay">
    <div class="gameover-title" style="color:#ffd23f;text-shadow:0 3px 0 #b3541e,0 6px 0 #7a3410,0 12px 24px rgba(0,0,0,.8)">PAUSED</div>
    <button class="btn" id="resumeBtn">RESUME</button>
    <button class="btn" id="quitBtn" style="font-size:18px;padding:10px 30px">QUIT TO MENU</button>
    <button id="soundBtn" aria-label="Toggle sound" style="pointer-events:auto;width:56px;height:56px;border:0;padding:0;background:none;cursor:pointer;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))"><img style="width:100%;height:100%;object-fit:contain" alt="" /></button>
  </div>

  <div class="overlay hidden" id="gameOverOverlay">
    <div class="gameover-title" id="gameOverTitle">GAME OVER</div>
    <div class="final-score" id="finalScore">Score: 0</div>
    <div class="new-best hidden" id="newBest">★ NEW BEST! ★</div>
    <button class="btn" id="restartBtn">PLAY AGAIN</button>
  </div>

  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
