<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Glint — Library</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="/css/app.css" />
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b5cff'/%3E%3Cstop offset='1' stop-color='%23ff4fa3'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Ccircle cx='16' cy='16' r='5' fill='white'/%3E%3C/svg%3E" />
</head>
<body>
	<div id="top"></div>
	<main class="page">
		<section class="hero">
			<div>
				<h1>Your <span class="grad-text">videos</span></h1>
				<p>Record once. Skip the meeting. Let the AI write the recap.</p>
			</div>
			<div class="spacer"></div>
			<div class="stats" id="stats"></div>
		</section>
		<div class="toolbar">
			<div class="search" id="search"></div>
			<select class="input" id="sort" style="width:auto">
				<option value="new">Newest</option>
				<option value="old">Oldest</option>
				<option value="views">Most viewed</option>
				<option value="long">Longest</option>
			</select>
			<div class="spacer"></div>
			<span id="aiPill"></span>
		</div>
		<div id="list" class="grid"></div>
	</main>
	<script type="module" src="/js/library.js"></script>
</body>
</html>
