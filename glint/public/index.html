<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Glint — Library</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="/css/app.css" />
	<link rel="stylesheet" href="/css/fx.css" />
	<link rel="icon" href="/logo.svg" type="image/svg+xml" />
	<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
	<link rel="manifest" href="/manifest.webmanifest" />
	<meta name="theme-color" content="#07070b" />
</head>
<body>
	<div id="fx-veil" class="covered"><div class="p p1"></div><div class="p p2"></div></div>
	<div id="top"></div>
	<main class="page">
		<section class="hero">
			<div>
				<h1>Your <span class="grad-text">videos</span></h1>
				<p>Record once. Skip the meeting. Let the AI write the recap.</p>
			</div>
			<div class="spacer"></div>
			<div class="stats" id="stats"></div>
		</section>
		<div class="toolbar">
			<div class="search" id="search"></div>
			<select class="input" id="sort" style="width:auto">
				<option value="new">Newest</option>
				<option value="old">Oldest</option>
				<option value="views">Most viewed</option>
				<option value="long">Longest</option>
			</select>
			<div class="spacer"></div>
			<span id="aiPill"></span>
		</div>
		<div id="list" class="grid"></div>
	</main>
	<script type="module" src="/js/library.js"></script>
</body>
</html>
