<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Transcript</title>
<style>
  :root { --bg:#f7f7f8; --card:#fff; --fg:#1a1a1a; --muted:#666; --border:#ddd; --accent:#c4302b; --err:#b00020; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141414; --card:#1e1e1e; --fg:#eee; --muted:#999; --border:#333; --accent:#ff4e45; --err:#ff6b6b; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.55 system-ui, -apple-system, Segoe UI, sans-serif; }
  main { max-width:820px; margin:0 auto; padding:32px 16px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 20px; }
  form { display:flex; gap:8px; flex-wrap:wrap; }
  input[type=text] { flex:1 1 300px; padding:12px 14px; font-size:1rem; border:1px solid var(--border); border-radius:8px; background:var(--card); color:var(--fg); }
  button { padding:12px 18px; font-size:1rem; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  button.secondary { background:transparent; color:var(--fg); border:1px solid var(--border); padding:8px 12px; font-size:.9rem; }
  button:disabled { opacity:.6; cursor:wait; }
  .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:20px 0 8px; }
  .meta { color:var(--muted); font-size:.9rem; margin-right:auto; }
  label { font-size:.9rem; color:var(--muted); display:flex; gap:6px; align-items:center; }
  pre { white-space:pre-wrap; word-wrap:break-word; background:var(--card); border:1px solid var(--border); border-radius:8px; padding:16px; font:inherit; max-height:65vh; overflow:auto; }
  .err { color:var(--err); margin-top:16px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>YouTube Transcript</h1>
  <p class="sub">Paste a YouTube link to get its transcript.</p>
  <form id="f">
    <input id="url" type="text" placeholder="https://www.youtube.com/watch?v=..." autofocus required>
    <button id="go" type="submit">Get transcript</button>
  </form>
  <div id="err" class="err" hidden></div>
  <section id="out" hidden>
    <div class="bar">
      <span id="meta" class="meta"></span>
      <label><input id="ts" type="checkbox"> Timestamps</label>
      <button id="copy" class="secondary" type="button">Copy</button>
      <button id="dl" class="secondary" type="button">Download .txt</button>
    </div>
    <pre id="text"></pre>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
let data = null;
const render = () => { $("text").textContent = $("ts").checked ? data.text_with_timestamps : data.text; };
$("f").addEventListener("submit", async e => {
  e.preventDefault();
  $("go").disabled = true; $("go").textContent = "Fetching…";
  $("err").hidden = true; $("out").hidden = true;
  try {
    const r = await fetch("/api/transcript?url=" + encodeURIComponent($("url").value.trim()));
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "Something went wrong");
    data = j;
    $("meta").textContent = `${j.language} · ${j.is_generated ? "auto-generated" : "manual"} captions · ${j.segments.length} lines`;
    render(); $("out").hidden = false;
  } catch (err) {
    $("err").textContent = err.message; $("err").hidden = false;
  } finally {
    $("go").disabled = false; $("go").textContent = "Get transcript";
  }
});
$("ts").addEventListener("change", render);
$("copy").addEventListener("click", async () => {
  await navigator.clipboard.writeText($("text").textContent);
  $("copy").textContent = "Copied!"; setTimeout(() => $("copy").textContent = "Copy", 1500);
});
$("dl").addEventListener("click", () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([$("text").textContent], {type:"text/plain"}));
  a.download = `transcript-${data.video_id}.txt`; a.click();
});
</script>
</body>
</html>
